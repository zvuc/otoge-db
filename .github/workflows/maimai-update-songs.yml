name: "[maimai] Fetch new songs"

on:
  schedule:
    - cron: '0 0-5 * * 3-5'
  workflow_dispatch:

concurrency:
  group: maimai-update-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch_songs:
    name: Fetch latest song list from SEGA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: 'Asia/Tokyo'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git user
        run: |
          git config --global user.email "noreply@github.com"
          git config --global user.name "GitHub Actions"

      - name: Select update branch
        id: select_branch
        run: |
          # Run the updater on the child branch to avoid stash conflicts
          git fetch origin
          BRANCH_NAME=$(git for-each-ref --format='%(refname:short)' refs/remotes/origin/maimai/update-* | sed 's#^origin/##' | sort -V | tail -n 1)

          if [ -n "$BRANCH_NAME" ]; then
            DATESTAMP="${BRANCH_NAME##*-}"
            git switch --track "origin/$BRANCH_NAME"
            git pull --ff-only origin "$BRANCH_NAME"
            echo "existing_branch=true" >> "$GITHUB_OUTPUT"
          else
            git switch main
            git pull --ff-only origin main
            DATESTAMP=""
            echo "existing_branch=false" >> "$GITHUB_OUTPUT"
          fi

          echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          echo "datestamp=$DATESTAMP" >> "$GITHUB_OUTPUT"

      - name: Run main script and capture output
        run: |
          python -u scripts/update-songs.py --maimai --nocolors --markdown --no_timestamp --no_verbose 2>&1 | tee output.log

      - name: Extract datestamp and prepare branch
        id: prepare_branch
        run: |
          if output=$(git status --porcelain) && [ -z "$output" ]; then
            echo "has_diffs=false" >> "$GITHUB_OUTPUT"
            echo "No changes found. Skipping."
          else
            echo "has_diffs=true" >> "$GITHUB_OUTPUT"

            DATESTAMP="${{ steps.select_branch.outputs.datestamp }}"
            BRANCH_NAME="${{ steps.select_branch.outputs.branch_name }}"
            if [ "${{ steps.select_branch.outputs.existing_branch }}" != "true" ]; then
              DATESTAMP=$(jq -r '[.[].date_added // empty] | .[-1] // empty' maimai/data/music-ex.json)
              if [ -z "$DATESTAMP" ] || [ "$DATESTAMP" = "null" ]; then
                DATESTAMP=$(date '+%Y%m%d')
              fi
              BRANCH_NAME="maimai/update-$DATESTAMP"
              git checkout -b "$BRANCH_NAME"
            fi

            echo "datestamp=$DATESTAMP" >> "$GITHUB_OUTPUT"
            echo "branch_name=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch initial wiki and constants data
        if: steps.prepare_branch.outputs.has_diffs == 'true'
        run: |
          DATESTAMP="${{ steps.prepare_branch.outputs.datestamp }}"
          {
            python -u scripts/update-wiki-data.py --maimai --date "$DATESTAMP" --nocolors --markdown --noskip --no_timestamp --no_verbose || true
            python -u scripts/update-const.py --maimai --date "$DATESTAMP" --nocolors --markdown --no_timestamp --no_verbose || true
          } 2>&1 | tee -a output.log

      - name: Commit and push changes
        id: commit_changes
        if: steps.prepare_branch.outputs.has_diffs == 'true'
        run: |
          DATESTAMP="${{ steps.prepare_branch.outputs.datestamp }}"
          BRANCH_NAME="${{ steps.prepare_branch.outputs.branch_name }}"
          git add .

          if output=$(git status --porcelain) && [ -z "$output" ]; then
            echo "No changes to commit."
            echo "has_diffs=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data(maimai): [bot] add song data $DATESTAMP"
            git push origin "$BRANCH_NAME" --force-with-lease -u
            echo "has_diffs=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.prepare_branch.outputs.has_diffs == 'true' && steps.commit_changes.outputs.has_diffs == 'true'
        run: |
          python scripts/post-pr.py \
            --head "${{ steps.prepare_branch.outputs.branch_name }}" \
            --base "main" \
            --title "[Automation] maimai: Add new songs (${{ steps.prepare_branch.outputs.datestamp }})" \
            --log-file "output.log"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

