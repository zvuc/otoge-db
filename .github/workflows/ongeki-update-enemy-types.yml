name: "[Ongeki] Fetch enemy types"

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  fetch_enemy_types:
    name: Auto-update missing enemy types from YouTube
    runs-on: ubuntu-latest

    steps:
      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Tokyo"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install yt-dlp pillow

      - name: Configure Git user
        run: |
          git config --global user.email "noreply@github.com"
          git config --global user.name "GitHub Actions"

      - name: Checkout existing branch or create new
        run: |
          git fetch origin
          if git show-ref --quiet refs/remotes/origin/ongeki-staging; then
            git switch ongeki-staging
            git rebase origin/master
          else
            git checkout -b ongeki-staging
          fi

      - name: Run main script and capture output
        id: run_script
        run: |
          {
            echo "OUTPUT_LOG<<EOF"
            PYTHONPATH=scripts python scripts/ongeki/update_enemy_types.py --refresh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit_changes
        run: |
          git add .

          if output=$(git status --porcelain) && [ -z "$output" ]; then
            echo "HAS_DIFFS=false" >> "$GITHUB_OUTPUT"
            echo "No changes. Skipping PR."
          else
            git commit -m "data(ongeki): [bot] update enemy types"
            git push origin ongeki-staging --force-with-lease
            echo "Commited changes."
            echo "HAS_DIFFS=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing PR or create new
        if: steps.commit_changes.outputs.HAS_DIFFS == 'true'
        run: |
          if [[ $(gh pr list --state open --head ongeki-staging | grep ongeki-staging) ]]; then
            echo "PR currently open. Add comment to existing open PR"
            gh pr comment ongeki-staging \
              --body "${{ steps.run_script.outputs.OUTPUT_LOG }}"
          else
            echo "No currently open PR for ongeki-staging. Create new PR"
            gh pr create \
              -B ${{ github.ref_name }} \
              -H "ongeki-staging" \
              --title "[Automation] Ongeki: Update enemy types" \
              --body "${{ steps.run_script.outputs.OUTPUT_LOG }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
