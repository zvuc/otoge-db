name: "[Ongeki] Fetch from wiki & sdvx.in (all songs)"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch_from_wiki_all:
    name: Fetch from wiki & sdvx.in (all songs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TZ: 'Asia/Tokyo'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure Git user
        run: |
          git config --global user.email "noreply@github.com"
          git config --global user.name "GitHub Actions"

      - name: Checkout existing branch or create new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin
          BRANCH="ongeki/wiki-sync"

          HAS_OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number' 2>/dev/null || true)

          if [ -n "$HAS_OPEN_PR" ]; then
            echo "Found open PR #$HAS_OPEN_PR for $BRANCH. Updating existing branch..."
            git switch "$BRANCH"
            git rebase origin/main || {
              echo "Rebase conflict detected on open PR. Aborting rebase to preserve branch state."
              git rebase --abort
            }
          else
            echo "No open PR found for $BRANCH. Starting clean branch from origin/main..."
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Run wiki script and capture output
        run: |
          {
            python -u scripts/update-wiki-data.py --ongeki --all --nocolors --escape --markdown --noskip --no_timestamp --no_verbose
            python -u scripts/update-chartguide-data.py --ongeki --all --nocolors --escape --markdown --no_timestamp --no_verbose
          } 2>&1 | tee output.log

      - name: Commit changes
        id: commit_changes
        run: |
          git add .

          if output=$(git status --porcelain) && [ -z "$output" ]; then
            echo "HAS_DIFFS=false" >> "$GITHUB_OUTPUT"
            echo "No changes. Skipping PR request"
          else
            git commit -m "data(ongeki): [bot] add song extra data (all songs)"
            git push origin ongeki/wiki-sync --force-with-lease -u
            echo "Committed changes."
            echo "HAS_DIFFS=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout existing PR or create new
        if: steps.commit_changes.outputs.HAS_DIFFS == 'true'
        run: |
          python scripts/post-pr.py \
            --head "ongeki/wiki-sync" \
            --base "main" \
            --title "[Automation] Ongeki: Full wiki & chartguide sync" \
            --log-file "output.log"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

